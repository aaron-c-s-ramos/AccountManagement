[package]
name = "account-management"
version = "2.0.0"
edition = "2021"
authors = ["Aaron Christopher Ramos <aaron.c.s.ramos@gmail.com>"]
description = "Windows Local User and Group Management (lusrmgr) desktop GUI and CLI written in Rust"
license = "GPL-3.0-only"
repository = "https://github.com/aaron-c-s-ramos/AccountManagement"
readme = "README.md"
keywords = ["windows", "lusrmgr", "users", "groups", "gui"]
categories = ["gui", "os::windows-apis", "command-line-utilities"]
exclude = ["Screenshots/*", "packaging/*"]

[[bin]]
name = "lusrmgr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
